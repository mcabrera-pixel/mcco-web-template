name: deploy
# Estándar Web MCCO v2 §7: push a main = build + mcco-check + deploy a producción + smoke.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository != 'mcabrera-pixel/mcco-web-template'
    uses: mcabrera-pixel/mcco-web-kit/.github/workflows/site-deploy.yml@v1.1.3-rc.1
    secrets: inherit
